jobs:
  # ==========================================
  # STAGE 1: CI Unit Tests
  # ==========================================
  continuous-integration:
    runs-on: ubuntu-latest
    
    # NEW: Spin up a temporary Postgres DB on the GitHub Runner for your tests!
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: password
          # We need to create the default DB your app looks for
          POSTGRES_DB: auth_db 
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # NEW: Separate each service into its own step using 'working-directory'
      - name: Test JWT Security
        working-directory: ./jwt-security
        run: chmod +x ./mvnw && ./mvnw clean test

      - name: Test Content Service
        working-directory: ./content-service
        run: chmod +x ./mvnw && ./mvnw clean test

      - name: Test Subscription Service
        working-directory: ./subscription-service
        run: chmod +x ./mvnw && ./mvnw clean test

      - name: Test API Gateway
        working-directory: ./api-gateway
        run: chmod +x ./mvnw && ./mvnw clean test

  # ... (Keep Stage 2 and Stage 3 exactly as they were)