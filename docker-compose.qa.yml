services:
  # Single Postgres instance handling all 3 databases
  postgres-qa:
    image: postgres:15-alpine
    container_name: postgres-qa
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - aviator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jwt-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/jwt-service:latest
    container_name: jwt-service
    environment:
      - SERVER_PORT=4000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-qa:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APPLICATION_SECURITY_JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - APPLICATION_SECURITY_ADMIN_SECRET=${ADMIN_SECRET}
      - APPLICATION_SECURITY_JWT_EXPIRATION={JWT_EXP}
      - JAVA_OPTS=-XX:+UseSerialGC -Xms64m -Xmx128m
    depends_on:
      postgres-qa:
        condition: service_healthy
    networks:
      - aviator-network

  content-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/content-service:latest
    container_name: content-service
    environment:
      - SERVER_PORT=4001
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-qa:5432/content_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APPLICATION_SECURITY_JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - APPLICATION_SECURITY_JWT_EXPIRATION=%{JWT_EXP}
      - JAVA_OPTS=-XX:+UseSerialGC -Xms64m -Xmx128m
    depends_on:
      postgres-qa:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aviator-network

  subscription-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/subscription-service:latest
    container_name: subscription-service
    environment:
      - SERVER_PORT=4002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-qa:5432/subscription_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APPLICATION_SECURITY_JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JAVA_OPTS=-XX:+UseSerialGC -Xms64m -Xmx128m
    depends_on:
      postgres-qa:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aviator-network

  kafka:
    image: apache/kafka-native:latest
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CLUSTER_ID=4L62xdwCQKW6u5ydgFeZgA
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_HEAP_OPTS=-Xms128m -Xmx256m
    networks:
      - aviator-network

  api-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY}/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseSerialGC -Xms64m -Xmx128m
    networks:
      - aviator-network
    depends_on:
      - jwt-service
      - content-service
      - subscription-service

  ui-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/ui-frontend:latest
    container_name: ui-frontend
    ports:
      - "3000:3000"
    networks:
      - aviator-network
    depends_on:
      - api-gateway

networks:
  aviator-network:
    driver: bridge

volumes:
  postgres_qa_data:
